# PostgreSQL для етапу 1+. Зараз застосунок працює без БД (демо-документ у памʼяті).
services:
  db:
    image: postgres:16-alpine
    container_name: dndsheet-db
    environment:
      POSTGRES_DB: dndsheet
      POSTGRES_USER: dndsheet
      POSTGRES_PASSWORD: dndsheet
    ports:
      - "5433:5432"
    volumes:
      - dndsheet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndsheet -d dndsheet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dndsheet-pgdata:
