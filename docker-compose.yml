# The whole app in Docker: API + the built SPA on one port.
#
#   docker compose up -d --build     → http://127.0.0.1:8000
#   docker compose up --build --watch → the same + auto-rebuild after code changes
#   docker compose logs -f app
#   docker compose down
#
#   docker compose --profile test run --rm --build test   → pytest + DDD gates in the image
#   docker compose --profile dev up                      → http://127.0.0.1:5173,
#       Vite and `uvicorn --reload` with code from disk: changes show up in seconds, no rebuild
#
# Data (characters, wizard drafts, users) lives in ./var/dndsheet.sqlite3
# on the host — the directory is mounted into the container, so characters don't die with the image.
#
# Sign-in: via Telegram (DNDSHEET_TELEGRAM_BOT and DNDSHEET_TELEGRAM_BOT_TOKEN in the .env
# file next to this one, which isn't in git). Until a bot is set up, a "development sign-in"
# by name works — that's why the port is open only on this computer (127.0.0.1). Before
# exposing the app to a network, remove DNDSHEET_DEV_LOGIN. Details — RUN.md.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: dndsheet:local
    container_name: dndsheet-app
    environment:
      DNDSHEET_DATA_DIR: /app/var
      DNDSHEET_CONTENT_DIR: /app/content
      DNDSHEET_SPA_DIST: /app/frontend/dist
      DNDSHEET_DEV_LOGIN: ${DNDSHEET_DEV_LOGIN:-1}
      DNDSHEET_TELEGRAM_BOT: ${DNDSHEET_TELEGRAM_BOT:-}
      DNDSHEET_TELEGRAM_BOT_TOKEN: ${DNDSHEET_TELEGRAM_BOT_TOKEN:-}
      DNDSHEET_OWNER_TELEGRAM_ID: ${DNDSHEET_OWNER_TELEGRAM_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./var:/app/var
    restart: unless-stopped
    # Auto-rebuild: `docker compose up --build --watch` (or watch-docker.cmd)
    # watches the code and rebuilds and restarts the container after changes.
    # Needs Docker Compose 2.22+ (in Docker Desktop 4.24+).
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./content/translations

  # Tests in the image with the corpus: `docker compose --profile test run --rm --build test`.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: dndsheet:test

  # Fast dev mode: the API with `--reload` and Vite with hot reload.
  # The code is mounted from disk, so the image doesn't need rebuilding.
  api-dev:
    profiles: ["dev"]
    image: dndsheet:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dndsheet-api-dev
    environment:
      DNDSHEET_DATA_DIR: /app/var
      DNDSHEET_CONTENT_DIR: /app/content
      DNDSHEET_DEV_LOGIN: "1"
      PYTHONPATH: /app/backend/src
    command: ["python", "-m", "uvicorn", "dndsheet.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/backend/src"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./var:/app/var
      - ./backend/src:/app/backend/src
      - ./content/translations:/app/content/translations

  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: dndsheet-web-dev
    working_dir: /web
    environment:
      # Vite proxies to the API in the neighboring container (see frontend/vite.config.ts).
      VITE_API_TARGET: http://api-dev:8000
    command: ["sh", "-c", "npm ci && npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/web
      - dndsheet-web-modules:/web/node_modules
    depends_on:
      - api-dev

  # PostgreSQL isn't used by the app yet (state is SQLite in var/).
  # Start it if needed: docker compose --profile db up -d
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: dndsheet-db
    environment:
      POSTGRES_DB: dndsheet
      POSTGRES_USER: dndsheet
      POSTGRES_PASSWORD: dndsheet
    ports:
      - "5433:5432"
    volumes:
      - dndsheet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndsheet -d dndsheet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dndsheet-pgdata:
  # node_modules for Linux, separate from the Windows copy on disk.
  dndsheet-web-modules:
