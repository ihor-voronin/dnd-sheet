<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Шрифти Alegreya — з @fontsource у збірці (див. src/main.tsx), без Google Fonts. -->
    <title>Листок персонажа · D&amp;D 5e</title>
    <!-- Іконки: кубик d20 у кольорах сайту (scripts/make_icons.py). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#11141b" />
    <!--
      Mini App у Telegram: скрипт Telegram вантажимо лише тоді, коли сторінку відкрив
      Telegram (його параметри в hash або вже збережені ним у sessionStorage після
      перезавантаження). Звичайний сайт telegram.org не чіпає. Синхронно й до
      застосунку — так вимагає Telegram (див. src/telegram.ts).
    -->
    <script>
      (function () {
        var fromTelegram = /tgWebApp/.test(location.hash + location.search);
        try {
          fromTelegram = fromTelegram || !!sessionStorage.getItem("__telegram__initParams");
        } catch (e) {}
        if (fromTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js?59"><\/script>');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
