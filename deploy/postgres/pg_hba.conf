# Who may connect (first match wins). Which database a role may open is decided by
# GRANT CONNECT (create-project.sql), so this file never needs a line per project.

# TYPE  DATABASE  USER      ADDRESS   METHOD
# The superuser only through the Unix socket inside the container: `docker exec pg psql -U
# postgres`. Whoever can run `docker exec` is root on the host anyway, so a password adds nothing.
local   all       postgres            trust
local   all       all                 reject
host    all       postgres  all       reject
# Project roles from containers on the `pg` Docker network (and loopback, if published).
host    all       all       samenet   scram-sha-256
host    all       all       all       reject
