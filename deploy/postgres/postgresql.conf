# Shared PostgreSQL on a 2 vCPU / 2.4 GiB VPS that also runs the apps (docs/database.md).
# Small and predictable rather than fast: the data is megabytes, the risk is memory.

listen_addresses = '*'            # inside the container; no port is published to the host
port = 5432
max_connections = 40              # all projects together; each app role also has a CONNECTION LIMIT
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# Memory (container limit 512 MB).
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = off
jit = off                         # no win for small OLTP queries, costs memory
max_parallel_workers_per_gather = 0
max_worker_processes = 4

# WAL and checkpoints: small disk footprint, crash safety untouched (fsync, full_page_writes on).
wal_level = replica               # leaves the door open for pg_basebackup / a standby later
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_timeout = 15min
wal_compression = lz4
default_toast_compression = lz4  # character JSON documents compress better and faster

# Runaway protection for every project.
idle_in_transaction_session_timeout = 60s
statement_timeout = 0             # per role instead (create-project.sql sets 30 s for apps)

# Observability.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
log_min_duration_statement = 500ms
log_connections = off
log_lock_waits = on
log_temp_files = 10MB
log_timezone = 'UTC'
timezone = 'UTC'

# Autovacuum defaults are fine for this size; keep it on.
autovacuum = on
