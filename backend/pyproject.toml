[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dndsheet"
version = "0.1.0"
description = "D&D 5e (2014) character sheet builder and exporter, Ukrainian"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# WeasyPrint на Windows потребує GTK; поки що PDF-тести скіпаються, якщо його немає.
pdf = ["weasyprint>=62", "pypdf>=4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/characters"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

# ---------------------------------------------------------------------------
# DDD-гейти. Запуск: lint-imports --config backend/pyproject.toml
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "dndsheet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Домен не залежить від інфраструктури та фреймворків"
type = "forbidden"
source_modules = [
    "dndsheet.characters.domain",
    "dndsheet.sheets.domain",
    "dndsheet.export.domain",
    "dndsheet.compendium.domain",
    "dndsheet.shared",
]
forbidden_modules = [
    "dndsheet.characters.application",
    "dndsheet.characters.infrastructure",
    "dndsheet.characters.api",
    "dndsheet.sheets.application",
    "dndsheet.sheets.infrastructure",
    "dndsheet.sheets.api",
    "dndsheet.export.application",
    "dndsheet.export.infrastructure",
    "dndsheet.export.api",
    "dndsheet.compendium.application",
    "dndsheet.compendium.infrastructure",
    "dndsheet.compendium.api",
    "fastapi",
    "sqlalchemy",
    "jinja2",
]

[[tool.importlinter.contracts]]
name = "characters: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.characters.api",
    "dndsheet.characters.application",
    "dndsheet.characters.domain",
]

[[tool.importlinter.contracts]]
name = "sheets: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.sheets.api",
    "dndsheet.sheets.application",
    "dndsheet.sheets.domain",
]

[[tool.importlinter.contracts]]
name = "export: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.export.api",
    "dndsheet.export.application",
    "dndsheet.export.domain",
]

[[tool.importlinter.contracts]]
name = "compendium: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.compendium.api",
    "dndsheet.compendium.application",
    "dndsheet.compendium.domain",
]
