[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dndsheet"
version = "0.1.0"
description = "D&D 5e (2014) character sheet builder and exporter, Ukrainian"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Without [standard]: the app doesn't need uvloop, httptools, watchfiles and websockets
    # (~20 MB in the image); --reload in dev works without watchfiles too.
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# WeasyPrint on Windows needs GTK; the PDF tests are skipped when it's missing.
pdf = ["weasyprint>=62", "pypdf>=4"]

# Test and gate tools: a dependency group, not an extra — it never reaches the
# package or the production image (`uv sync --no-dev`).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.22",
    # starlette.testclient: httpx2 (plain httpx is deprecated there).
    "httpx2>=2.16",
    "import-linter>=2.0",
    # The term glossary (test_terminology); it used to come transitively with uvicorn[standard].
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

# The PDF template lives next to the renderer: without this line the wheel doesn't ship it,
# and `pip install backend` gives a renderer that can't find 'sheet' (500 on /export/pdf).
[tool.setuptools.package-data]
"dndsheet.export.infrastructure" = ["templates/*", "templates/fonts/*"]
"dndsheet.site.api" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/characters"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

# Coverage: python -m pytest backend --cov --cov-config=backend/pyproject.toml
# Paths are stored relative to the working directory (the repository root locally,
# /app in the test image), so the XML report matches the repository for diff-cover.
[tool.coverage.run]
source = ["dndsheet"]
relative_files = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# DDD gates. Run: lint-imports backend/pyproject.toml
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "dndsheet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain does not depend on infrastructure or frameworks"
type = "forbidden"
source_modules = [
    "dndsheet.characters.domain",
    "dndsheet.sheets.domain",
    "dndsheet.export.domain",
    "dndsheet.compendium.domain",
    "dndsheet.identity.domain",
    "dndsheet.site.domain",
    "dndsheet.visuals.domain",
    "dndsheet.shared",
]
forbidden_modules = [
    "dndsheet.characters.application",
    "dndsheet.characters.infrastructure",
    "dndsheet.characters.api",
    "dndsheet.sheets.application",
    "dndsheet.sheets.infrastructure",
    "dndsheet.sheets.api",
    "dndsheet.export.application",
    "dndsheet.export.infrastructure",
    "dndsheet.export.api",
    "dndsheet.compendium.application",
    "dndsheet.compendium.infrastructure",
    "dndsheet.compendium.api",
    "dndsheet.identity.application",
    "dndsheet.identity.infrastructure",
    "dndsheet.identity.api",
    "dndsheet.site.application",
    "dndsheet.site.infrastructure",
    "dndsheet.site.api",
    "dndsheet.visuals.application",
    "dndsheet.visuals.api",
    "fastapi",
    "sqlalchemy",
    "jinja2",
]

[[tool.importlinter.contracts]]
name = "characters: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.characters.api",
    "dndsheet.characters.application",
    "dndsheet.characters.domain",
]

[[tool.importlinter.contracts]]
name = "sheets: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.sheets.api",
    "dndsheet.sheets.application",
    "dndsheet.sheets.domain",
]

[[tool.importlinter.contracts]]
name = "export: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.export.api",
    "dndsheet.export.application",
    "dndsheet.export.domain",
]

[[tool.importlinter.contracts]]
name = "compendium: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.compendium.api",
    "dndsheet.compendium.application",
    "dndsheet.compendium.domain",
]

[[tool.importlinter.contracts]]
name = "identity: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.identity.api",
    "dndsheet.identity.application",
    "dndsheet.identity.domain",
]

[[tool.importlinter.contracts]]
name = "site: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.site.api",
    "dndsheet.site.application",
    "dndsheet.site.domain",
]

[[tool.importlinter.contracts]]
name = "visuals: api -> application -> domain"
type = "layers"
layers = [
    "dndsheet.visuals.api",
    "dndsheet.visuals.application",
    "dndsheet.visuals.domain",
]
