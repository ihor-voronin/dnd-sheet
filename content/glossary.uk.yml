# Глосарій v0 — українська термінологія D&D 5e
# Канонічні терміни й правило показу — docs/translation-rules.md.

> **Статус: чернетка.** Кожен термін має бути звірений з офіційним українським PDF (наявний у власника проєкту)
> і отримати `citation` (книга + сторінка). Поки `source` не вказано як `official`, термін вважається власним.
>
> Це не UI-рядки: інтерфейс перекладається через gettext, а ігрові терміни — тільки тут.

