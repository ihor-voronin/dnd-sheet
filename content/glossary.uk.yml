# Глосарій — ЄДИНЕ джерело української термінології проєкту.
#
# Тут вирішується, як перекладається термін. Правило показу «Українська (English)»
# і де лежать переклади — docs/translation-rules.md.
#   avoid       — написання, заборонені скрізь (код, екран, переклади корпусу);
#   avoid_code  — заборонені в коді й на екрані (у художніх текстах слово має інше значення).
# Тест backend/tests/api/test_terminology.py читає ці списки.
#
# Статус: чернетка. Кожен термін має бути звірений з офіційним українським PDF
# і отримати `citation` (книга + сторінка). Поки `source` не `official`, термін власний.

