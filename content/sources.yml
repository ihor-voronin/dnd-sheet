# Прогалини — те, чого в корпусі немає й не буде з доступних джерел.
# Деталі: docs/books.md §11. Усе, що можна було взяти з дзеркала 5e.tools,
# узято й розібрано (див. блок mirror нижче).
gaps:
  - id: not-on-ddb
    title: "AL-модулі, Runeterra, Blood Hunter, третя сторона"
    status: unavailable
    note: "State of Hillsfar / Mulmaster Bonds / CoS: Optional Backgrounds на дзеркалі відсутні — перевірено: книга AL містить лише Faction Guide, а в backgrounds.json немає жодного запису з source=AL. Лишаються тільки на DMs Guild. Runeterra (Dark Tides of Bilgewater) і Blood Hunter — третя сторона, на дзеркалі їх немає."
  - id: paitm
    title: "Planescape: Adventures in the Multiverse"
    type: sourcebook
    status: substituted
    note: "Книги немає в бібліотеці, але її частини — Sigil and the Outlands (sato) і Morte's Planar Parade (mpp) — завантажено з дзеркала й розібрано: 7 рис, 2 передісторії, 2 закляття, 5 предметів, 54 статблоки. Загальних глав про Сіґіл (яких немає ні в SatO, ні в MPP) не буде."
  - id: optional-features
    title: "Опційні вміння (invocations, maneuvers, metamagic, fighting styles)"
    type: supplement
    status: not-modelled
    note: "У дзеркалі 233 записи optionalfeature (PHB 82, TCE 47, XGE 22 …), але в контракті немає категорії optionalfeature — спершу її треба додати в contract/compendium-format.json. Поки що ці вміння є лише текстом у записах класів."

# Розібране з дзеркала 5e.tools (scripts/ingest/mirror5e.py).
# Кількості — з content/{compendium,bestiary}/<тека>/, тобто те, що реально
# лягло в корпус, а не кількість посилань у тексті книги.
mirror:
  dirs: 41
  records: 1714
  backfilled_subclasses: 116
  totals:
    backgrounds: 27
    feats: 10
    species: 47
    subclasses: 6
    spells: 5
    items: 282
    monsters: 1337
  note: "8 книг першої хвилі (ToA, CoS, GoS, OotA, IMR, BGDIA, SatO, MPP) + 33 теки другої. Окремо добрано підкласи 8 книг, які вже були в корпусі, але без них (PHB 40, XGE 31, TCE 30, SCAG 6, EGW 3, DMG 2, FTD 2, VRGR 2). Статблоки, що лише посилаються на Monster Manual (_copy), розкриті через content/raw/_index/bestiary/ (MM, VGM, MTF, MPMM, VRGR, SKT, LLK)."
  empty:
    - {folder: al, why: "лише Faction Guide — жодної сутності для листка"}
