# Реєстр джерел (база знань) — D&D 5e, лінійка 2014
#
# Призначення: машинний перелік книг, доступних у власній бібліотеці D&D Beyond,
# з ознаками «що дає листку» і чергою конвеєра. Це індекс, а не текст книг.
#
# Наявність звірено 2026-11-25: 33 сорсбуки + 15 пригод. Плюс 1 безкоштовна книга поза бібліотекою (ddvram). # Безкоштовні промо, яких уже не взяти, — docs/books.md §9.1.

meta:
  version: 1
  updated: "2026-11-26"
  edition: "2014"
  library_checked: "2026-11-25"
  source_of_truth: "D&D Beyond, My Library, ownership=owned"
  docs: "docs/books.md"
  second_source: "5e.tools (неофіційне дзеркало) — docs/books.md §7.4; завантажувач scripts/ingest/fetch_5etools.py"
  note: "Корпус: 93 джерела в content/sources.yml, з них 92 мають записи (у al тексту немає сутностей). 7272 записи у 9 категоріях: 52 книги власної бібліотеки D&D Beyond (у т. ч. добрані підкласи) + 41 тека, розібрана з дзеркала 5e.tools (scripts/ingest/mirror5e.py): 1714 записів. status=ingested означає, що книгу розібрано; translate/verify — наступні етапи. Перелік тек дзеркала, кількості й пастки — у блоці mirror нижче та docs/books.md §7.4."

# Поля запису:
#   id         — стабільний ідентифікатор (використовується в compendium_entries.source_id)
#   title      — оригінальна назва
#   type       — core | sourcebook | adventure | accessory | promo
#   tier       — 1 | 1.5 | 2 | 3 | null (черга конвеєра; null = поза скоупом)
#   ddb        — slug на D&D Beyond (/sources/dnd/<slug>)
#   license    — srd | proprietary | free | third_party
#   scope      — sheet | monsters | items | rules | excluded
#   categories — що саме дає листку
#   status     — registered | ingested | translated | verified

