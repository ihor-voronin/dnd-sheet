# CI: every PR into main and every push to main.
#
# Three checks — required by the main branch ruleset (.github/rulesets/main.json):
#   pre-commit — the same hooks as locally (.pre-commit-config.yaml) + the PR title;
#   backend    — the full tests and import contracts in the test Docker image
#                (the book corpus is unlocked with the git-crypt key from the GIT_CRYPT_KEY secret);
#   frontend   — types, ESLint, build.
# After a green CI on main, .github/workflows/deploy.yml runs the deploy.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # main is merged by squash: the commit message on main is the PR title.
      # The same limits as .gitlint applies to local commits.
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#TITLE}" -gt 100 ]; then echo "::error::PR title is longer than 100 characters (${#TITLE})"; exit 1; fi
          if echo "$TITLE" | grep -qiw "wip"; then echo "::error::PR title contains WIP"; exit 1; fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Frontend dependencies (eslint, prettier, tsc for the hooks)
        run: npm ci
        working-directory: frontend
      - run: pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Hooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --show-diff-on-failure --color=always \
              --hook-stage pre-commit --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run --show-diff-on-failure --color=always --hook-stage pre-commit --all-files
          fi

  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Unlock corpus (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "$GIT_CRYPT_KEY" ]; then echo "::error::The GIT_CRYPT_KEY secret is missing (docs/ci.md)"; exit 1; fi
          sudo apt-get install -y --no-install-recommends git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/git-crypt.key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
          rm -f "$RUNNER_TEMP/git-crypt.key"

      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: dndsheet:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests and import contracts
        run: docker run --rm dndsheet:test

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
