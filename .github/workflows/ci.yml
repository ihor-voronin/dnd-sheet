# CI: кожен PR у main і кожен push у main.
#
# Три перевірки — їх вимагає правило гілки main (.github/rulesets/main.json):
#   pre-commit — ті самі хуки, що й локально (.pre-commit-config.yaml), + заголовок PR;
#   backend    — повні тести й контракти імпортів у тестовому Docker-образі
#                (корпус книг розблоковується git-crypt ключем із секрету GIT_CRYPT_KEY);
#   frontend   — типи, ESLint, збірка.
# Після зеленого CI на main деплой запускає .github/workflows/deploy.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Main зливається squash-ом: повідомлення коміту в main — це заголовок PR.
      # Ті самі межі, що й у .gitlint для локальних комітів.
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${#TITLE}" -gt 100 ]; then echo "::error::Заголовок PR довший за 100 символів (${#TITLE})"; exit 1; fi
          if echo "$TITLE" | grep -qiw "wip"; then echo "::error::Заголовок PR містить WIP"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Frontend dependencies (eslint, prettier, tsc для хуків)
        run: npm ci
        working-directory: frontend
      - run: pip install pre-commit
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Hooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --show-diff-on-failure --color=always \
              --hook-stage pre-commit --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            pre-commit run --show-diff-on-failure --color=always --hook-stage pre-commit --all-files
          fi

  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unlock corpus (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "$GIT_CRYPT_KEY" ]; then echo "::error::Немає секрету GIT_CRYPT_KEY (docs/ci.md)"; exit 1; fi
          sudo apt-get install -y --no-install-recommends git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/git-crypt.key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
          rm -f "$RUNNER_TEMP/git-crypt.key"

      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: dndsheet:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests and import contracts
        run: docker run --rm dndsheet:test

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
