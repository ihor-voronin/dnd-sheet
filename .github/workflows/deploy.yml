# Deploys the app to https://dnd.voronin.app after a green CI on main.
#
# The deploy itself lives in vps-infra (the shared VPS): its reusable workflow checks this
# repository out, unlocks git-crypt (secrets and the corpus), builds the `runtime` image and
# runs its scripts/deploy_app.py with deploy/project.toml. A failed release rolls back to the
# previous one. docs/deploy.md; vps-infra docs/deploys.md.
#
# The production environment: Settings → Environments can add a required approval
# before every deploy and allow deploys from main only.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dndsheet
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Only a green CI after a push to main, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ihor-voronin/vps-infra/.github/workflows/deploy-app.yml@v1
    with:
      platform-ref: v1 # keep equal to the tag in `uses:`
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      target: runtime
      url: https://dnd.voronin.app
    secrets: inherit # GIT_CRYPT_KEY
