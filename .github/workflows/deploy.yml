# Деплой застосунку на https://dnd.voronin.app — після зеленого CI на main.
#
# Збирає образ тут (з розблокованим корпусом) і віддає його scripts/deploy_app.py:
# той самий скрипт, що й з Windows (`deploy\terraform\deploy.ps1`). Terraform тут
# не запускається — інфраструктура (DNS, налаштування сервера) змінюється вручну.
#
# Середовище production: у Settings → Environments можна додати обовʼязкове
# підтвердження перед кожним деплоєм і дозволити деплой лише з main.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Лише зелений CI після push у main або ручний запуск з main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://dnd.voronin.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Unlock secrets and corpus (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "$GIT_CRYPT_KEY" ]; then echo "::error::Немає секрету GIT_CRYPT_KEY (docs/ci.md)"; exit 1; fi
          sudo apt-get install -y --no-install-recommends git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/git-crypt.key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
          rm -f "$RUNNER_TEMP/git-crypt.key"

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: dndsheet:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server
        run: python3 scripts/deploy_app.py
