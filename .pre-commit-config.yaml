# Pre-commit checks.
#
#   pre-commit install                 # once: installs the pre-commit and commit-msg hooks
#   pre-commit run --all-files         # run everything by hand
#   pre-commit run ruff-format --files backend/src/...   # a single hook
#
# Formatters (ruff-format, prettier, end-of-file-fixer…) fix files themselves
# and stop the commit: review the changes, `git add` and commit again.
default_stages: ["pre-commit"]
default_language_version:
  node: lts
default_install_hook_types: ["pre-commit", "commit-msg"]
# Files encrypted by git-crypt (secrets and the book corpus) are plaintext in the working copy;
# formatters and linters leave them alone. secrets-encrypted checks they really are encrypted.
exclude: |
  (?x)^(
    frontend/src/contract/.*|
    deploy/terraform/\.terraform\.lock\.hcl|
    deploy/secrets/.*|
    content/(compendium|bestiary|index)/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: end-of-file-fixer
        alias: format-end-of-line
      - id: trailing-whitespace
        exclude: \.md$
      - id: fix-byte-order-marker
        # Windows PowerShell 5 reads a .ps1 without a BOM as cp1251 — the BOM is needed there.
        exclude: \.ps1$
      - id: check-json
      - id: check-yaml
      - id: check-toml

  # uv.lock must match pyproject.toml: a changed dependency without a new lock fails here,
  # not later in the Docker build (`uv sync --frozen`).
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.10
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff
        name: Sort imports with ruff
        alias: format-ruff-isort
        args: ["--select", "I", "--fix"]
      - id: ruff-format
        alias: format-ruff

  # Secrets in code: TruffleHog from a Docker image (winget has no Windows binary).
  # Files encrypted by git-crypt are excluded above: they hold secrets in the working copy by design.
  - repo: local
    hooks:
      - id: trufflehog
        name: trufflehog — secrets in changed files
        language: docker_image
        entry: trufflesecurity/trufflehog:3.90.0 filesystem --fail --no-update --log-level=-1

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        alias: format-shfmt
        args: ["-w", "-i", "2", "-ci"]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: local
    hooks:
      - id: secrets-encrypted
        name: git-crypt — secrets and the corpus are committed only encrypted
        entry: python scripts/check_secrets_encrypted.py
        language: system
        always_run: true
        pass_filenames: false

      # Prettier and the import-sorting plugin come from frontend/node_modules:
      # pre-commit's node environment on Windows doesn't let prettier find the plugin by name.
      - id: prettier
        name: format files with prettier
        alias: format-prettier
        language: system
        entry: python scripts/rundir.py frontend npx --no-install prettier --write --ignore-unknown --log-level warn --
        types_or: [javascript, jsx, ts, tsx, css, json]
        files: ^frontend/

      - id: eslint
        name: lint javascript and typescript code
        language: system
        entry: python scripts/rundir.py frontend npx --no-install eslint --max-warnings=0 --no-warn-ignored --pass-on-unpruned-suppressions --
        types_or: ["javascript", "jsx", "ts", "tsx"]
        files: ^frontend/.*$

      - id: tsc
        name: validate typescript
        language: system
        entry: python scripts/rundir.py frontend npx --no-install tsc --noEmit
        files: ^frontend/(.*\.(ts|tsx|json))$
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt
        alias: format-terraform
        language: system
        entry: terraform fmt
        files: \.(tf|tfvars)$
