# Ruff for the whole repository (backend, scripts).
line-length = 119
target-version = "py311"
extend-exclude = ["backend/tests/**/_tmp_*"]

[lint]
select = [
    "RUF", # ruff-specific rules
    "E",   # pycodestyle-errors
    "W",   # pycodestyle-warnings
    "F",   # pyflakes
    "PL",  # Pylint
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
    "T20", # flake8-print
]
ignore = [
    "E203",    # Whitespace before punctuation
    "E501",    # Line too long, handled by ruff-format
    "PLC0415", # Import should be at top-level
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0917", # Too many positional arguments (same family as PLR0913)
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLW0603", # Using the global statement
    "PLW2901", # `for` loop variable overwritten by assignment target
    "RUF001",  # String contains ambiguous symbol (Cyrillic)
    "RUF002",  # Docstring contains ambiguous symbol (Cyrillic)
    "RUF003",  # Comment contains ambiguous symbol (Cyrillic)
    "RUF005",  # Collection literal concatenation
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM105",  # Use `contextlib.suppress(Exception)`
    "SIM108",  # Use ternary operator
    "SIM114",  # Combine `if` branches
    "RUF100",  # Unused noqa
]

[lint.per-file-ignores]
# Scripts and tests print to the console by design.
"scripts/**" = ["T20"]
"backend/tests/**" = ["T20"]

[lint.pydocstyle]
convention = "google"
